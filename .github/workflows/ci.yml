# Builds and tests on runners without Smart App Control, so every change is
# verified even when a developer's Windows machine blocks local test binaries.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# The jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Timeouts: the network tests and e2e.sh use real sockets, and a hang would
# otherwise hold a runner for GitHub's default of 6 hours.
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: make test
      - name: End-to-end (vcd driven by vc_send)
        run: make e2e
      - name: Build the uinput backend
        # Compile check only: runners give no write access to /dev/uinput.
        run: make BACKEND=uinput

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
      - name: Unit tests
        run: mingw32-make test
      - name: End-to-end (vcd driven by vc_send)
        run: mingw32-make e2e
      - name: Build the ViGEm backend
        # Compile and link check only: runners do not have the ViGEmBus driver.
        run: |
          git clone --depth 1 https://github.com/nefarius/ViGEmClient.git third_party/ViGEmClient
          mingw32-make BACKEND=vigem

  # Darwin is the kernel family iOS runs on: the phone engine's test
  # (test_client) runs here against Apple's sockets, and the Swift package
  # the iOS app uses is built for macOS.
  apple:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests, including the phone engine
        run: make test
      - name: Swift package (VCCore + VirtualController)
        run: swift build
      - name: Swift package for iOS (adds the UIKit GamepadView)
        run: xcodebuild -scheme VirtualController -destination 'generic/platform=iOS Simulator' build

  # The Android library: the C core and JNI bridge for every ABI, plus Kotlin.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build vccore
        run: gradle -p mobile/android :vccore:assembleRelease
